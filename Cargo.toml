[package]
name = "jellyfish-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.28"
rayon = "1.10"
rocksdb = { version = "0.22", default-features = false, features = ["snappy"] }
sha2 = "0.10.9"

[lib]
bench = false

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
bench = false

[[bin]]
name = "compact-db"
path = "src/bin/compact_db.rs"

[profile.release]
debug = true
