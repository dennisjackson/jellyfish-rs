[package]
name = "jellyfish-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
dashmap = { version = "6.1.0", features = ["rayon"] }
env_logger = "0.11.8"
hex = "0.4.3"
log = "0.4.28"
rand = "0.9.2"
tempfile = "3.14"
rayon = "1.10"
rocksdb = { version = "0.22", default-features = false, features = ["snappy"] }
rusqlite = { version = "0.32", features = ["bundled", "limits"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10.9"
indicatif = "0.18.1"
fastrand = "2.3.0"

[dev-dependencies]
divan = "0.1.21"

[lib]
bench = false

[[bin]]
name = "build-durable-tree"
path = "src/bin/build_durable_tree.rs"
bench = false

[[bin]]
name = "dump-sqlite"
path = "src/bin/dump_sqlite.rs"
bench = false

[[bin]]
name = "test-mermaid"
path = "src/bin/test_mermaid.rs"
bench = false

[[bench]]
name = "mpt_benchmark"
harness = false

[profile.release]
debug = true
