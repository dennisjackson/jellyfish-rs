[package]
name = "jellyfish-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
dashmap = { version = "6.1.0", features = ["rayon"] }
log = "0.4.28"
rand = "0.9.2"
tempfile = "3.14"
rayon = "1.10"
rocksdb = { version = "0.22", default-features = false, features = ["snappy"] }
rusqlite = { version = "0.32", features = ["bundled", "limits"] }
sha2 = "0.10.9"
indicatif = { version = "0.18.1", optional = true }
fastrand = { version = "2.3.0", optional = true }
env_logger = { version = "0.11.8", optional = true }

[dev-dependencies]
env_logger = "0.11.8"

[features]
bins = ["dep:indicatif", "dep:fastrand", "dep:env_logger"]

[lib]
bench = false

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
bench = false
required-features = ["bins"]

[[bin]]
name = "dump-sqlite"
path = "src/bin/dump_sqlite.rs"
bench = false
required-features = ["bins"]

[[bin]]
name = "test-mermaid"
path = "src/bin/test_mermaid.rs"
bench = false
required-features = ["bins"]

[profile.release]
debug = true
